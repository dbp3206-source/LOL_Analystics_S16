<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a2a">
<title>LoL Analytics S16 · Study Atlas</title>
<style>
html,body{margin:0;min-height:100%;background:#071a2a;color:#e8f5ff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.card{width:min(560px,calc(100vw - 48px));box-sizing:border-box;padding:28px;border:1px solid #1f5b73;border-radius:18px;background:#0b2436;box-shadow:0 20px 60px #0007}
.spin{width:44px;height:44px;border:4px solid #163e55;border-top-color:#5eead4;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}h1{font-size:22px;margin:0 0 8px}p{opacity:.8;line-height:1.55}a{color:#67e8f9}
</style>
</head>
<body>
<div class="boot"><div class="card"><div class="spin"></div>
<h1>Đang tải Study Atlas v1.1</h1>
<p>Khôi phục giao diện mobile, sơ đồ, code viewer và trạng thái học…</p>
<p id="status">Đang tải dữ liệu…</p></div></div>
<script>
(async()=>{
  const status=document.getElementById('status');
  const parts=[
    'assets/study-atlas-v11/payload.part1.txt',
    'assets/study-atlas-v11/payload.part2.txt',
    'assets/study-atlas-v11/payload.part3.txt',
    'assets/study-atlas-v11/payload.part4.txt'
  ];

  async function decodeBrotli(bytes){
    // Cách 1: dùng API native nếu trình duyệt hỗ trợ.
    try{
      const ds=new DecompressionStream('brotli');
      const stream=new Blob([bytes]).stream().pipeThrough(ds);
      return await new Response(stream).text();
    }catch(nativeErr){
      // Cách 2: fallback WebAssembly cho Chrome/WebView không có Brotli stream.
      status.textContent='Đang tải bộ giải nén tương thích…';
      let mod;
      try{
        mod=await import('https://unpkg.com/brotli-wasm@3.0.0/index.web.js?module');
      }catch(primaryErr){
        mod=await import('https://cdn.jsdelivr.net/npm/brotli-wasm@3.0.0/index.web.js');
      }
      const brotli=await mod.default;
      const out=brotli.decompress(bytes);
      return new TextDecoder('utf-8').decode(out);
    }
  }

  try{
    const texts=await Promise.all(parts.map(async p=>{
      const r=await fetch(p,{cache:'no-cache'});
      if(!r.ok) throw new Error(p+' · HTTP '+r.status);
      return r.text();
    }));

    status.textContent='Đang giải nén nội dung…';
    const raw=atob(texts.join('').replace(/\s/g,''));
    const bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);

    const html=await decodeBrotli(bytes);
    if(!html || html.length<1000000) throw new Error('Nội dung giải nén không hợp lệ.');

    status.textContent='Đang mở bài học…';
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    console.error(err);
    document.querySelector('.card').innerHTML=
      '<h1>Không thể tải Study Atlas</h1>'+
      '<p>'+String(err.message||err)+'</p>'+
      '<p>Hãy tải lại trang. Nếu vẫn lỗi, gửi lại ảnh màn hình cho mình.</p>';
  }
})();
</script>
</body></html>
