<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08242e">
<title>LoL Analytics S16 · Study Atlas V2</title>
<style>
html,body{margin:0;min-height:100%;background:#08242e;color:#e8f5f2;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.card{width:min(560px,calc(100vw - 48px));box-sizing:border-box;padding:28px;border:1px solid #315359;border-radius:18px;background:#0b3037;box-shadow:0 20px 60px #0007}
.spin{width:44px;height:44px;border:4px solid #1b4a4f;border-top-color:#22c8a6;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}h1{font-size:22px;margin:0 0 8px}p{opacity:.82;line-height:1.55}
</style>
</head>
<body>
<div class="boot"><div class="card"><div class="spin"></div>
<h1>Đang tải Study Atlas V2</h1>
<p>Theory + Build Lab · 47 modules</p>
<p id="status">Đang nạp nội dung thực hành…</p></div></div>
<script>
(async()=>{
  const status=document.getElementById('status');
  const version='v2-20260930-1819';
  const parts=Array.from({length:13},(_,i)=>
    'assets/study-atlas-v2/part'+String(i+1).padStart(2,'0')+'.html?'+version
  );

  try{
    // Remove the previous V1 service worker/cache so a refresh cannot restore V1.
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('lol-analytics-study-atlas')).map(k=>caches.delete(k)));
    }

    const texts=[];
    for(let i=0;i<parts.length;i++){
      status.textContent='Đang nạp V2 · '+(i+1)+'/'+parts.length;
      const r=await fetch(parts[i],{cache:'no-store'});
      if(!r.ok) throw new Error(parts[i]+' · HTTP '+r.status);
      texts.push(await r.text());
    }

    const html=texts.join('');
    if(html.length<6200000 || !html.includes('BUILD LAB') || !html.includes('PROJECT-DERIVED LAB')){
      throw new Error('Nội dung V2 không vượt qua kiểm tra toàn vẹn.');
    }

    status.textContent='Đang mở Study Atlas V2…';
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    console.error(err);
    document.querySelector('.card').innerHTML=
      '<h1>Không thể tải Study Atlas V2</h1>'+
      '<p>'+String(err.message||err)+'</p>'+
      '<p>Hãy tải lại trang một lần.</p>';
  }
})();
</script>
</body></html>
