name: Deploy LoL Analytics Study Atlas

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "assets/study-atlas-v11/**"
      - ".github/workflows/deploy-study-atlas.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static Study Atlas
        shell: bash
        run: |
          python -m pip install --quiet brotli
          python - <<'PY'
          from pathlib import Path
          import base64, brotli

          src = Path("assets/study-atlas-v11")
          parts = [src / f"payload.part{i}.txt" for i in range(1, 5)]

          missing = [str(p) for p in parts if not p.exists()]
          if missing:
              raise SystemExit("Missing payload files: " + ", ".join(missing))

          encoded = "".join(p.read_text(encoding="utf-8") for p in parts)
          compressed = base64.b64decode("".join(encoded.split()))
          html = brotli.decompress(compressed)

          if len(html) < 1_000_000:
              raise SystemExit(f"Decoded HTML is unexpectedly small: {len(html)} bytes")

          out = Path("_site")
          out.mkdir(exist_ok=True)
          (out / "index.html").write_bytes(html)
          (out / ".nojekyll").write_text("", encoding="utf-8")

          print(f"Built _site/index.html: {len(html):,} bytes")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
