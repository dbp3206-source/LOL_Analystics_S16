name: Deploy Study Atlas V2 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "assets/study-atlas-v2/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static V2 site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cat assets/study-atlas-v2/part*.html > _site/index.html
          cp _site/index.html _site/404.html
          touch _site/.nojekyll

          test -s _site/index.html
          test $(wc -c < _site/index.html) -gt 6500000
          grep -q "BUILD LAB" _site/index.html
          grep -q "PROJECT-DERIVED LAB" _site/index.html
          echo "Study Atlas V2 verified: $(wc -c < _site/index.html) bytes"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
